name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install package and all test integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[all]'
          python -m pip check
      - name: Run complete test suite, including offscreen GUI and Scenic
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
      - name: Summarize test failures
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'unittest.log'
          if log.exists():
              tail = '\n'.join(log.read_text().splitlines()[-80:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Test failure details::{escaped}')
          PY

  package:
    name: Package and clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel from source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate metadata, licences, and bundled resources
        run: |
          python -m twine check --strict dist/*
          python scripts/check_distribution.py
      - name: Install wheel in isolated base-only environment
        run: |
          python -m venv "$RUNNER_TEMP/navprobe-smoke-venv"
          "$RUNNER_TEMP/navprobe-smoke-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/navprobe-smoke-venv/bin/python" -m pip check
      - name: Exercise installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/navprobe-smoke-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"'
      - name: Retain checked release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: ${{ always() }}
    needs: [tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all test versions and package checks
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
