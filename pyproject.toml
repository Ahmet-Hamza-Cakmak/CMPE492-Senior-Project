[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "navprobe"
version = "0.1.0"
description = "Randomized navigation scenarios and simulation testing for mobile robots"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ahmet-Hamza-Cakmak"}]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/robo_sim_py/assets/google_robot/LICENSE"]
keywords = ["robotics", "navigation", "simulation", "randomized-testing", "mujoco", "scenic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = ["numpy>=1.24", "mujoco>=3.3.5,<4", "shapely>=2,<3"]

[project.urls]
Homepage = "https://github.com/Ahmet-Hamza-Cakmak/CMPE492-Senior-Project"
Repository = "https://github.com/Ahmet-Hamza-Cakmak/CMPE492-Senior-Project"
Issues = "https://github.com/Ahmet-Hamza-Cakmak/CMPE492-Senior-Project/issues"
Documentation = "https://github.com/Ahmet-Hamza-Cakmak/CMPE492-Senior-Project#readme"

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
scenic = ["scenic>=3.1,<4"]
all = ["PySide6>=6.8,<7", "scenic>=3.1,<4"]
dev = ["build>=1.2", "twine>=6"]

[project.scripts]
navprobe = "robo_sim_py.cli:main"
robo-sim-py = "robo_sim_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["navprobe*", "robo_sim_py*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
robo_sim_py = ["assets/**/*.xml", "assets/**/*.stl", "assets/**/*.obj", "assets/**/*.png", "assets/**/LICENSE", "assets/**/*.md", "scenarios/presets/*.json", "scenarios/scenic/*.scenic"]
