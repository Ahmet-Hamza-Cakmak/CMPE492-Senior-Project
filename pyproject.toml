[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "line-tracker-sim"
version = "0.1.0"
description = "GUI scenario builder for line-tracking robots in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3.5,<4"]

[project.scripts]
line-tracker-sim = "line_tracker_sim.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
line_tracker_sim = ["assets/*.xml"]
